name: 'deploy devcontainer'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - univ

env:
  IMAGE_NAME: ghcr.io/uoy-robostar/ros2-tb3-univ/auro-dev
  #VSLAM_IMAGE_NAME: ghcr.io/uoy-robostar/ros2-tb3-univ/vslam-dev

jobs:
  build:
    strategy:
      fail-fast: false
      # Native runners: linux/arm64 builds on a hosted arm64 runner instead of
      # emulating under QEMU, which would be prohibitively slow for this Dockerfile.
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      packages: write
    runs-on: ${{ matrix.runner }}
    steps:

      - name: Checkout (GitHub)
        uses: actions/checkout@v4

      - name: Prepare platform tag
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds and pushes a single-platform, arch-suffixed tag. The merge job
      # below combines the amd64/arm64 tags into one multi-arch manifest.
      - name: Build and run Dev Container task
        uses: devcontainers/ci@v0.3
        env:
          GIT_AUTH_TOKEN: ${{ secrets.ARGOS3_ROS2_BRIDGE_GIT_TOKEN }}
        with:
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: latest-${{ env.PLATFORM_PAIR }}
          platform: ${{ matrix.platform }}
          runCmd: echo "success"
          refFilterForPush: refs/heads/main
          env: |
            GIT_AUTH_TOKEN=${{ secrets.ARGOS3_ROS2_BRIDGE_GIT_TOKEN }}

  merge:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest and push
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:latest-linux-amd64 \
            ${{ env.IMAGE_NAME }}:latest-linux-arm64

