name: 'build and deploy devcontainer'

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on: # rebuild any PRs and main branch changes
  pull_request:
    branches: [ "univ" ]
  push:
    branches:
      - univ
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: uoy-robostar/ros2-tb3-univ
  DEVCONTAINER_IMAGE_NAME: ghcr.io/uoy-robostar/ros2-tb3-univ/auro-dev

jobs:
  # Builds and pushes the plain (non-devcontainer) image from .devcontainer/Dockerfile.
  # The devcontainer-build job below pulls this published image (see .devcontainer/
  # devcontainer.json's "image" field) and layers devcontainer Features on top of it,
  # instead of rebuilding the same ~20min ROS/Gazebo/moveit2/ARGoS/Pangolin/Stella stack
  # from scratch a second time.
  docker-build:
    strategy:
      fail-fast: false
      # Native runners: linux/arm64 builds on a hosted arm64 runner instead of
      # emulating under QEMU, which would be prohibitively slow for this Dockerfile.
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare platform tag
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build (and, outside PRs, push by digest) a single-platform image.
      # The per-platform digests are combined into one multi-arch manifest by the
      # docker-merge job below.
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}
          secrets: |
            "GIT_AUTH_TOKEN=${{ secrets.ARGOS3_ROS2_BRIDGE_GIT_TOKEN }}"

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-main-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-main-*
          merge-multiple: true

      # Install the cosign tool
      # https://github.com/sigstore/cosign
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker.
      # docker/metadata-action's default "latest" tagging only fires on the repo's
      # configured default branch (main), but this workflow only ever runs on univ - so
      # "latest" is tagged explicitly here rather than relying on that default.
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/univ' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      # Combine the per-platform digests pushed by the build matrix into one multi-arch manifest
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}

  # Builds the devcontainer image: layers devcontainer Features (e.g. desktop-lite/VNC,
  # see .devcontainer/devcontainer.json) on top of the image docker-build/docker-merge
  # already built and published above, rather than rebuilding the whole Dockerfile a
  # second time. Waits for docker-merge so a "push" run picks up this commit's freshly
  # tagged ":latest" - but still runs (pulling whatever ":latest" currently exists) when
  # docker-merge is skipped because it's a PR. docker-build's own result is checked
  # separately: docker-merge is *also* skipped (not failed) when docker-build fails, since
  # its "needs: docker-build" has no always() - without this, a failed docker-build would
  # look identical to "skipped because PR" and this job would wrongly proceed anyway.
  devcontainer-build:
    needs: [docker-build, docker-merge]
    if: |
      always() &&
      needs.docker-build.result == 'success' &&
      (needs.docker-merge.result == 'success' || needs.docker-merge.result == 'skipped')
    strategy:
      fail-fast: false
      # Native runners: linux/arm64 builds on a hosted arm64 runner instead of
      # emulating under QEMU, which would be prohibitively slow for this Dockerfile.
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      packages: write
    runs-on: ${{ matrix.runner }}
    steps:

      - name: Checkout (GitHub)
        uses: actions/checkout@v4

      - name: Prepare platform tag
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # devcontainers/cli builds with "docker buildx build --output type=oci", which the
      # default "docker" buildx driver on GitHub-hosted runners can't export - it needs the
      # docker-container driver instead.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds and pushes a single-platform, arch-suffixed tag. The devcontainer-merge job
      # below combines the amd64/arm64 tags into one multi-arch manifest.
      - name: Build and run Dev Container task
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE_NAME }}
          imageTag: latest-${{ env.PLATFORM_PAIR }}
          platform: ${{ matrix.platform }}
          runCmd: echo "success"
          # This workflow's push trigger is "univ", not GitHub's usual default "main" -
          # refFilterForPush has to match that or the image build succeeds but never pushes.
          refFilterForPush: refs/heads/univ

  devcontainer-merge:
    needs: devcontainer-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/univ'
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest and push
        run: |
          docker buildx imagetools create \
            -t ${{ env.DEVCONTAINER_IMAGE_NAME }}:latest \
            ${{ env.DEVCONTAINER_IMAGE_NAME }}:latest-linux-amd64 \
            ${{ env.DEVCONTAINER_IMAGE_NAME }}:latest-linux-arm64
